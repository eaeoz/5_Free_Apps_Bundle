      }).join('');
      categoryBar.querySelectorAll('.cat-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          categoryBar.querySelector('.active')?.classList.remove('active');
          btn.classList.add('active');
          activeCategory = btn.dataset.cat;
          renderPosts();
        });
      });
    }

    // ── Render blog cards ──
    function renderPosts() {
      const filtered = POSTS.filter(p => {
        const matchCat = activeCategory === 'all' || p.category === activeCategory;
        const matchSearch = !searchQuery || p.title.toLowerCase().includes(searchQuery) || p.desc.toLowerCase().includes(searchQuery);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="blog-empty"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><p>No posts found matching your criteria</p></div>`;
        return;
      }

      grid.innerHTML = filtered.map((post, i) => {
        const catLabel = CATEGORIES.find(c => c.key === post.category)?.label || post.category;
        const catBg = `${post.accent}12`;
        const initials = '5A';

        let html = `<div class="blog-card${post.featured ? ' featured' : ''}" data-id="${post.id}" style="--card-accent:${post.accent};--cat-bg:${catBg};transition-delay:${i * 0.04}s" tabindex="0">`;
        html += `<div class="blog-card-accent" style="background:${post.accent}"></div>`;
        if (post.featured) {
          html += `<div class="blog-card-feat-visual"><div class="feat-icon"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></div></div>`;
        }
        html += `<div class="blog-card-body"><span class="blog-card-category" style="color:${post.accent};background:${catBg}">${catLabel}</span>`;
        html += `<div class="blog-card-date">${post.date} &middot; ${post.readTime}</div>`;
        html += `<h3 class="blog-card-title">${post.title}</h3>`;
        html += `<p class="blog-card-desc">${post.desc}</p>`;
        html += `<div class="blog-card-footer"><div class="blog-card-author"><div class="blog-card-avatar">${initials}</div><span class="blog-card-author-name">5 Free Apps Bundle</span></div>`;
        html += `<span class="blog-card-read">Read <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg></span>`;
        html += `</div></div></div>`;
        return html;
      }).join('');

      // Staggered entrance animation
      const cards = grid.querySelectorAll('.blog-card');
      cards.forEach((card, i) => {
        setTimeout(() => card.classList.add('visible'), 80 + i * 60);
      });

      // Click handler
      cards.forEach(card => {
        card.addEventListener('click', () => {
          const id = parseInt(card.dataset.id);
          const post = POSTS.find(p => p.id === id);
          if (post) openPostModal(post);
        });
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }
        });
      });
    }

    // ── Search ──
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase();
      renderPosts();
    });

    // ── Reading progress ──
    const progressBar = document.getElementById('readingProgress');
    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      progressBar.style.width = progress + '%';
    });

    // ── Post modal (simple overlay) ──
    let modalEl = null;
    function openPostModal(post) {
      if (modalEl) closePostModal();
      const catLabel = CATEGORIES.find(c => c.key === post.category)?.label || post.category;
      modalEl = document.createElement('div');
      modalEl.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:visibility 0.3s,opacity 0.3s ease';
      modalEl.innerHTML = `
        <div class="modal-bg" style="position:absolute;inset:0;background:var(--bg-overlay, rgba(4,4,12,0.88));backdrop-filter:blur(16px);cursor:pointer"></div>
        <div class="modal-card" style="position:relative;max-width:640px;width:90vw;max-height:80vh;overflow-y:auto;background:var(--bg-card, linear-gradient(160deg,rgba(26,26,46,0.95),rgba(22,33,62,0.95)));backdrop-filter:blur(12px);border-radius:24px;border:1px solid var(--border-color, rgba(255,255,255,0.04));box-shadow:0 20px 60px rgba(0,0,0,0.5);padding:36px;transform:scale(0.9) translateY(20px);opacity:0;transition:all 0.4s cubic-bezier(0.22,1,0.36,1)">
          <button class="modal-close" style="position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;border:1px solid var(--border-color, rgba(255,255,255,0.06));background:var(--bg-nav, rgba(8,8,15,0.6));color:var(--text-primary, #fff);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s;font-size:18px">&#10005;</button>
          <div style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;background:${post.accent}15;color:${post.accent}">${catLabel}</div>
          <div style="font-size:12px;color:var(--text-tertiary, rgba(255,255,255,0.25));font-weight:500;margin-bottom:8px">${post.date} &middot; ${post.readTime}</div>
          <h2 style="font-size:24px;font-weight:900;color:var(--text-primary, #fff);letter-spacing:-0.5px;line-height:1.2;margin-bottom:16px">${post.title}</h2>
          <div style="font-size:14px;color:var(--text-tertiary, rgba(255,255,255,0.55));line-height:1.8;margin-bottom:16px">${post.desc}</div>
          <div style="font-size:14px;color:var(--text-tertiary, rgba(255,255,255,0.55));line-height:1.8;border-top:1px solid var(--border-color, rgba(255,255,255,0.04));padding-top:20px">
            ${post.content || '<p style="color:var(--text-tertiary, rgba(255,255,255,0.3))">Full content coming soon.</p>'}
          </div>
        </div>`;
      document.body.appendChild(modalEl);
      document.body.style.overflow = 'hidden';

      requestAnimationFrame(() => {
        modalEl.style.visibility = 'visible';
        modalEl.style.opacity = '1';
        const card = modalEl.querySelector('.modal-card');
        requestAnimationFrame(() => { card.style.transform = 'scale(1) translateY(0)'; card.style.opacity = '1'; });
      });

      modalEl.querySelector('.modal-bg').addEventListener('click', closePostModal);
      modalEl.querySelector('.modal-close').addEventListener('click', closePostModal);
      document.addEventListener('keydown', modalKeyHandler);
    }

    function modalKeyHandler(e) {
      if (e.key === 'Escape') closePostModal();
    }

    function closePostModal() {
      if (!modalEl) return;
      const card = modalEl.querySelector('.modal-card');
      card.style.transform = 'scale(0.9) translateY(20px)';
      card.style.opacity = '0';
      modalEl.style.opacity = '0';
      setTimeout(() => {
        document.body.removeChild(modalEl);
        document.body.style.overflow = '';
        modalEl = null;
        document.removeEventListener('keydown', modalKeyHandler);
      }, 300);
    }

    // ── Init ──
    renderCategories();
    renderPosts();

    // Theme toggle
    (function() {
      function g(){var m=location.search.match(/[?&]theme=(light|dark)(&|$)/);if(m)return m[1];try{var v=localStorage.getItem('theme');if(v)return v}catch(e){}try{var d=JSON.parse(window.name);if(d&&d.theme)return d.theme}catch(e){}return null}
      function s(v){try{localStorage.setItem('theme',v)}catch(e){}try{var d=JSON.parse(window.name)||{};d.theme=v;window.name=JSON.stringify(d)}catch(e){}}
      function u(v){try{document.querySelectorAll('a[href]').forEach(function(a){var h=a.getAttribute('href');if(!h||h.startsWith('#')||h.startsWith('http')||h.startsWith('//')||h.startsWith('mailto'))return;var b=h.split('?')[0],p=(h.split('?')[1]||'').split('&').filter(function(x){return!x.startsWith('theme=')}).join('&');        if(v==='light'){p=p?p+'&theme=light':'theme=light';a.href=b+'?'+p}else{a.href=p?b+'?'+p:b}})}catch(e){}}
      try {
        const toggle = document.getElementById('themeToggle');
        if (!toggle) return;
        const stored = g();
        if (stored === 'light') document.documentElement.setAttribute('data-theme', 'light');
        u(stored||'dark');
        toggle.addEventListener('click', () => {
          const isLight = document.documentElement.getAttribute('data-theme') === 'light';
          const next = isLight ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', next);
          s(next);
          u(next);
          try{var u2=new URL(window.location);if(next==='light')u2.searchParams.set('theme','light');else u2.searchParams.delete('theme');history.replaceState(null,'',u2.pathname+u2.search)}catch(e){}
        });
      } catch(e) {}
    })();
  </script>
</body>
</html>

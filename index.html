  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary: #08080f;
      --bg-card: linear-gradient(160deg, rgba(26,26,46,0.7), rgba(22,33,62,0.7));
      --bg-nav: rgba(8,8,15,0.8);
      --bg-overlay: rgba(8,8,15,0.94);
      --slider-overlay-bg: rgba(8,8,15,0.88);
      --bg-slider: linear-gradient(160deg, rgba(26,26,46,0.5), rgba(22,33,62,0.5));
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.8);
      --text-tertiary: rgba(255,255,255,0.35);
      --text-muted: rgba(255,255,255,0.15);
      --border-color: rgba(255,255,255,0.04);
      --border-light: rgba(255,255,255,0.06);
      --grid-color: rgba(255,255,255,0.015);
      --glow-red: rgba(255,68,68,0.06);
      --glow-blue: rgba(59,130,246,0.05);
      --nav-link-color: rgba(255,255,255,0.4);
      --nav-link-hover-bg: rgba(255,255,255,0.04);
      --input-bg: rgba(0,0,0,0.3);
    }

    [data-theme="light"] {
      --bg-primary: #f0f2f5;
      --bg-card: linear-gradient(160deg, rgba(255,255,255,0.9), rgba(240,242,247,0.9));
      --bg-nav: rgba(255,255,255,0.85);
      --bg-overlay: rgba(255,255,255,0.94);
      --slider-overlay-bg: rgba(255,255,255,0.88);
      --bg-slider: linear-gradient(160deg, rgba(255,255,255,0.85), rgba(240,242,247,0.85));
      --text-primary: #1a1a2e;
      --text-secondary: rgba(26,26,46,0.8);
      --text-tertiary: rgba(26,26,46,0.5);
      --text-muted: rgba(26,26,46,0.2);
      --border-color: rgba(0,0,0,0.06);
      --border-light: rgba(0,0,0,0.08);
      --grid-color: rgba(0,0,0,0.04);
      --glow-red: rgba(255,68,68,0.04);
      --glow-blue: rgba(59,130,246,0.04);
      --nav-link-color: rgba(26,26,46,0.5);
      --nav-link-hover-bg: rgba(0,0,0,0.04);
      --input-bg: rgba(0,0,0,0.04);
      --slider-dot-bg: rgba(0,0,0,0.1);
      --slider-dot-hover: rgba(0,0,0,0.22);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 0;
      transition: background 0.4s ease, color 0.4s ease;
    }

    .nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--bg-nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border-color);max-width:100%;animation:navSlide 0.6s ease-out}
    @keyframes navSlide{0%{transform:translateY(-100%);opacity:0}100%{transform:translateY(0);opacity:1}}
    .nav-inner{display:flex;align-items:center;gap:32px;max-width:1280px;margin:0 auto;width:100%}
    .nav-logo{font-size:18px;font-weight:900;color:var(--text-primary);text-decoration:none;letter-spacing:-0.5px;display:flex;align-items:center;gap:10px;transition:opacity 0.25s}
    .nav-logo:hover{opacity:0.8}
    .nav-logo-dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#ff4444,#ff6b6b);flex-shrink:0}
    .nav-links{display:flex;align-items:center;gap:6px}
    .nav-link{padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;color:var(--nav-link-color);text-decoration:none;transition:all 0.3s ease}
    .nav-link:hover{color:var(--text-primary);background:var(--nav-link-hover-bg)}
    .nav-link.active{color:#ff4444;background:rgba(255,68,68,0.08)}
    .theme-toggle{width:38px;height:38px;border-radius:12px;border:1px solid var(--border-color);background:var(--nav-link-hover-bg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);flex-shrink:0;color:var(--text-tertiary);margin-left:8px;position:relative;overflow:hidden}
    .theme-toggle:hover{transform:translateY(-2px) scale(1.06);border-color:transparent;color:var(--text-primary);background:var(--nav-link-hover-bg)}
    .theme-toggle:active{transform:scale(0.92)}
    .theme-toggle svg{width:18px;height:18px;fill:currentColor;transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1),opacity 0.3s ease;position:absolute}
    .theme-toggle .sun{opacity:0;transform:rotate(-90deg) scale(0.5)}
    [data-theme="light"] .theme-toggle .sun{opacity:1;transform:rotate(0) scale(1)}
    [data-theme="light"] .theme-toggle .moon{opacity:0;transform:rotate(90deg) scale(0.5)}
    .theme-toggle::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at center,var(--text-primary) 0%,transparent 70%);opacity:0;transition:opacity 0.4s ease}
    .theme-toggle:active::after{opacity:0.08}
    @media(max-width:660px){.theme-toggle{width:34px;height:34px;margin-left:4px}}
    @media(max-width:660px){
      .nav{padding:12px 16px}
      .nav-inner{gap:12px}
      .nav-logo{font-size:15px}
      .nav-logo-text{display:none}
      .nav-link{padding:6px 8px;font-size:11px}
      .nav-links{gap:2px}
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .bg-glow::before {
      content: '';
      position: absolute;
      top: -20%;
      left: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, var(--glow-red), transparent 60%);
      animation: glowDrift 12s ease-in-out infinite alternate;
    }

    .bg-glow::after {
      content: '';
      position: absolute;
      bottom: -20%;
      right: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, var(--glow-blue), transparent 60%);
      animation: glowDrift 14s ease-in-out infinite alternate-reverse;
    }

    @keyframes glowDrift {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(60px, 40px) scale(1.2);
      }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px;
    }

    /* ── Hero Header ── */
    .hero {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeDown 0.8s ease-out;
    }

    .hero h1 {
      font-size: 42px;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: -1.5px;
      line-height: 1.15;
    }

    .hero h1 span {
      background: linear-gradient(135deg, #ff4444, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      color: var(--text-tertiary);
      font-size: 15px;
      font-weight: 500;
      margin-top: 8px;
    }

    .hero-grand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-top: 20px;
      padding: 14px 32px;
      background: rgba(255, 68, 68, 0.06);
      border: 1px solid rgba(255, 68, 68, 0.12);
      border-radius: 60px;
      backdrop-filter: blur(8px);
    }

    .hero-grand-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-tertiary);
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .hero-grand-num {
      font-size: 28px;
      font-weight: 900;
      color: #ff4444;
      letter-spacing: -1px;
    }

    /* ── Repo Grid ── */
    .grid {
      display: flex;
      flex-flow: row wrap;
      justify-content: center;
      gap: 28px;
    }

    /* ── Repo Card ── */
    .repo-card {
      flex: 0 1 360px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 28px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
      opacity: 0;
      transform: translateY(40px) scale(0.96);
      position: relative;
      overflow: hidden;
    }

    .repo-card.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .repo-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .repo-card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 16px 60px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
    }

    .repo-card:hover::before {
      opacity: 1;
    }

    .repo-owner {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 18px;
      text-align: center;
    }

    .repo-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      animation: avatarPulse 3s ease-in-out infinite;
      transition: transform 0.4s ease;
    }

    .repo-card:hover .repo-avatar {
      transform: scale(1.1);
    }

    @keyframes avatarPulse {
      0%, 100% { box-shadow: 0 0 12px var(--accent-glow); }
      50% { box-shadow: 0 0 28px var(--accent-glow), 0 0 60px var(--accent-glow); }
    }

    .repo-owner-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      margin-top: 6px;
      letter-spacing: 0.2px;
    }

    .repo-card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .repo-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--accent);
      box-shadow: 0 4px 16px var(--accent-glow);
      transition: transform 0.3s ease;
    }

    .repo-card:hover .repo-icon {
      transform: scale(1.08) rotate(-4deg);
    }

    .repo-icon svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }

    .repo-card-info {
      flex: 1;
      min-width: 0;
    }

    .repo-card-name {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .repo-card-desc {
      font-size: 11px;
      color: var(--text-tertiary);
      line-height: 1.5;
      margin-top: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .repo-card-sub {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .repo-card-count {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-text);
      background: var(--accent-bg);
      padding: 2px 10px;
      border-radius: 20px;
    }

    .repo-card-releases {
      font-size: 12px;
      color: var(--text-tertiary);
      font-weight: 500;
    }

    /* ── Executable Buttons ── */
    .exe-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .exe-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--nav-link-hover-bg);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .exe-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.04), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }

    .exe-btn:hover::after {
      transform: translateX(100%);
    }

    .exe-btn:hover {
      background: var(--nav-link-hover-bg);
      border-color: var(--accent);
      transform: translateX(4px);
    }

    .exe-btn:active {
      transform: translateX(4px) scale(0.98);
    }

    .exe-btn--disabled {
      cursor: default;
    }

    .exe-btn--disabled:hover {
      background: var(--nav-link-hover-bg);
      border-color: var(--border-light);
      transform: none;
    }

    .exe-btn--disabled:hover::after {
      transform: translateX(-100%);
    }

    /* ── Older Releases Toggle ── */
    .exe-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      margin: 2px 0;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.25s ease;
      user-select: none;
    }

    .exe-toggle:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .exe-toggle-arrow {
      font-size: 8px;
      color: var(--text-tertiary);
      transition: transform 0.35s ease;
      flex-shrink: 0;
    }

    .exe-toggle.open .exe-toggle-arrow {
      transform: rotate(90deg);
    }

    .exe-toggle-label {
      flex: 1;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      transition: color 0.25s ease;
    }

    .exe-toggle-label {
      color: var(--text-tertiary);
    }

    .exe-toggle-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-tertiary);
      padding: 2px 10px;
      border-radius: 10px;
      background: var(--nav-link-hover-bg);
    }

    .exe-older-wrap {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .exe-older-wrap.open {
      grid-template-rows: 1fr;
    }

    .exe-older-inner {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 2px;
    }

    .exe-older-inner .exe-btn {
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .exe-older-wrap.open .exe-older-inner .exe-btn {
      opacity: 1;
      transform: translateY(0);
    }

    .exe-older-wrap.open .exe-older-inner .exe-btn:nth-child(1) { transition-delay: 0.03s; }
    .exe-older-wrap.open .exe-older-inner .exe-btn:nth-child(2) { transition-delay: 0.06s; }
    .exe-older-wrap.open .exe-older-inner .exe-btn:nth-child(3) { transition-delay: 0.09s; }
    .exe-older-wrap.open .exe-older-inner .exe-btn:nth-child(4) { transition-delay: 0.12s; }
    .exe-older-wrap.open .exe-older-inner .exe-btn:nth-child(5) { transition-delay: 0.15s; }
    .exe-older-wrap.open .exe-older-inner .exe-btn:nth-child(6) { transition-delay: 0.18s; }
    .exe-older-wrap.open .exe-older-inner .exe-btn:nth-child(7) { transition-delay: 0.21s; }
    .exe-older-wrap.open .exe-older-inner .exe-btn:nth-child(8) { transition-delay: 0.24s; }

    .exe-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--nav-link-hover-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .exe-icon svg {
      width: 14px;
      height: 14px;
      fill: var(--text-tertiary);
    }

    .exe-info {
      flex: 1;
      min-width: 0;
    }

    .exe-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .repo-footer {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--nav-link-color);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--nav-link-hover-bg);
      border: 1px solid var(--border-light);
      transition: all 0.25s ease;
    }

    .repo-link:hover {
      color: var(--text-primary);
      background: var(--nav-link-hover-bg);
      border-color: var(--accent);
    }

    .repo-link svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .star-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-tertiary);
    }

    .star-badge svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    .install-box {
      margin-top: 14px;
      margin-bottom: 14px;
      position: relative;
    }

    .install-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-tertiary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .install-label::before {
      content: '\26A1';
      font-size: 11px;
    }

    .install-code-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background: var(--input-bg);
      border: 1px solid var(--border-light);
      cursor: pointer;
    }

    .install-code {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      color: var(--text-tertiary);
      overflow-x: auto;
      white-space: nowrap;
      transition: color 0.3s ease;
      user-select: all;
    }

    .install-code-wrap:hover .install-code {
      color: rgba(255, 255, 255, 0.85);
    }

    .install-copy {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      background: var(--nav-link-hover-bg);
      border: 1px solid var(--border-light);
      border-radius: 6px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease, background 0.2s ease;
      font-family: inherit;
    }

    .install-copy:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .install-code-wrap:hover .install-copy {
      opacity: 1;
    }

    .install-overlay {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: var(--bg-overlay);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 10;
    }

    .install-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .install-overlay-step {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .install-overlay-step code {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 9px;
      color: var(--accent);
      background: var(--nav-link-hover-bg);
      padding: 1px 5px;
      border-radius: 3px;
    }

    .install-overlay-step kbd {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 9px;
      color: var(--text-primary);
      background: var(--nav-link-hover-bg);
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .install-overlay-arrow {
      color: rgba(255, 255, 255, 0.15);
      font-size: 11px;
    }

    .exe-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .exe-size {
      font-size: 10px;
      color: var(--text-tertiary);
      font-weight: 500;
    }

    .exe-dl-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-text);
      background: var(--accent-bg);
      padding: 1px 8px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .exe-dl-badge svg {
      width: 10px;
      height: 10px;
      fill: currentColor;
    }

    .exe-arrow {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      opacity: 0;
      transform: translateX(-6px);
      transition: all 0.25s ease;
    }

    .exe-arrow svg {
      width: 16px;
      height: 16px;
      fill: var(--accent);
    }

    .exe-btn:hover .exe-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .no-exe {
      padding: 20px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 13px;
      font-weight: 500;
    }

    /* ── Image Slider ── */
    .slider-section {
      margin-bottom: 48px;
      opacity: 0;
    }

    .slider-section.visible {
      animation: fallIn 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fallIn {
      0% {
        transform: translateY(-100vh) scale(0.5) rotate(-3deg);
        opacity: 0;
      }
      40% {
        transform: translateY(8vh) scale(1.03) rotate(0.8deg);
        opacity: 1;
      }
      55% {
        transform: translateY(-3vh) scale(0.98) rotate(-0.3deg);
      }
      68% {
        transform: translateY(1.5vh) scale(1.01) rotate(0.1deg);
      }
      78% {
        transform: translateY(-0.5vh) scale(0.995);
      }
      86% {
        transform: translateY(0.2vh) scale(1.002);
      }
      93% {
        transform: translateY(-0.1vh) scale(0.999);
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .slider-wrapper {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      background: var(--bg-slider);
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
    }

    .slider-viewport {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      height: 400px;
      touch-action: pan-y;
    }

    .slider-track {
      display: flex;
      height: 100%;
      transition: transform 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      will-change: transform;
    }

    .slider-track.dragging {
      transition: none !important;
    }

    .slider-track.dragging .slider-slide {
      pointer-events: none;
    }

    .slider-slide {
      min-width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.02) 0%, transparent 70%);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .slider-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      padding: 20px 24px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4));
      cursor: pointer;
    }

    .slider-slide:hover .slider-image {
      filter: drop-shadow(0 6px 30px rgba(0,0,0,0.5));
    }

    /* Click hint overlay on image */
    .slider-image-hint {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 4;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 10px;
      background: rgba(8,8,15,0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.04);
      font-size: 10px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.3px;
    }

    .slider-slide.active .slider-image-hint {
      opacity: 1;
      transition-delay: 0.6s;
    }

    .slider-image-hint svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .slider-glow {
      position: absolute;
      inset: -60px;
      z-index: 0;
      opacity: 0.2;
      transition: opacity 0.6s ease;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(60px);
    }

    .slider-slide.active .slider-glow {
      animation: glowPulse 2.5s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.15); }
    }

    .slider-image-glow-border {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      border-radius: 24px;
      opacity: 0;
      transition: opacity 0.6s ease;
      box-shadow: inset 0 0 80px var(--slider-accent-trans), 0 0 60px var(--slider-accent-trans);
    }

    .slider-slide.active .slider-image-glow-border {
      opacity: 0.6;
      animation: borderGlow 2.5s ease-in-out infinite;
    }

    @keyframes borderGlow {
      0%, 100% { box-shadow: inset 0 0 60px var(--slider-accent-trans), 0 0 40px var(--slider-accent-trans); }
      50% { box-shadow: inset 0 0 100px var(--slider-accent-trans), 0 0 80px var(--slider-accent-trans); }
    }

    .slider-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 32px 36px;
      background: linear-gradient(transparent, var(--slider-overlay-bg) 35%);
      z-index: 3;
      transform: translateY(24px);
      opacity: 0;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .slider-slide.active .slider-overlay {
      transform: translateY(0);
      opacity: 1;
      transition-delay: 0.25s;
    }

    .slider-label {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .slider-label-badge {
      display: inline-block;
      padding: 3px 14px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: var(--slider-accent);
      color: #fff;
      vertical-align: middle;
    }

    .slider-arrow {
      position: absolute;
      top: 50%;
      z-index: 10;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(8, 8, 15, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      opacity: 0;
      user-select: none;
      padding: 0;
      line-height: 1;
    }

    .slider-wrapper:hover .slider-arrow {
      opacity: 1;
    }

    .slider-arrow:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--slider-accent);
      transform: translateY(-50%) scale(1.1);
    }

    .slider-arrow:active {
      transform: translateY(-50%) scale(0.92);
    }

    .slider-arrow--prev { left: 18px; }
    .slider-arrow--next { right: 18px; }

    .slider-arrow svg {
      width: 22px;
      height: 22px;
      fill: rgba(255, 255, 255, 0.8);
      transition: fill 0.3s ease;
    }

    .slider-arrow:hover svg {
      fill: #fff;
    }

    .slider-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      position: relative;
      z-index: 2;
    }

    .slider-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: none;
      background: var(--slider-dot-bg, rgba(255, 255, 255, 0.1));
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      padding: 0;
      flex-shrink: 0;
    }

    .slider-dot::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid transparent;
      transition: border-color 0.4s ease;
    }

    .slider-dot.active {
      width: 32px;
      border-radius: 6px;
      background: var(--slider-accent);
    }

    .slider-dot.active::after {
      border-color: var(--slider-accent);
      border-radius: 10px;
    }

    .slider-dot:hover:not(.active) {
      background: var(--slider-dot-hover, rgba(255, 255, 255, 0.25));
      transform: scale(1.25);
    }

    .slider-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      z-index: 4;
      border-radius: 0 2px 0 0;
      background: var(--slider-accent);
      box-shadow: 0 0 14px var(--slider-accent), 0 0 30px color-mix(in srgb, var(--slider-accent) 25%, transparent);
      will-change: width;
    }

    @media (max-width: 860px) {
      .slider-viewport {
        height: 260px;
      }
      .slider-image {
        padding: 12px 14px;
      }
      .slider-overlay {
        padding: 20px 22px;
      }
      .slider-label {
        font-size: 17px;
      }
      .slider-label-badge {
        font-size: 8px;
        padding: 2px 10px;
      }
      .slider-arrow {
        width: 38px;
        height: 38px;
      }
      .slider-arrow--prev { left: 10px; }
      .slider-arrow--next { right: 10px; }
      .slider-section {
        margin-bottom: 28px;
      }
    }

    /* ── Animations ── */
    @keyframes fadeDown {
      0% {
        opacity: 0;
        transform: translateY(-20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes countUp {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .count-anim {
      display: inline-block;
      animation: countUp 0.5s ease-out both;
    }

    /* ── Loading ── */
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      gap: 20px;
    }

    .loader-ring {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.04);
      border-top-color: #ff4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      color: var(--text-tertiary);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .loader-dots span {
      display: inline-block;
      animation: dotPulse 1.4s ease-in-out infinite both;
      font-size: 20px;
      line-height: 1;
    }

    .loader-dots span:nth-child(1) { animation-delay: 0s; }
    .loader-dots span:nth-child(2) { animation-delay: 0.16s; }
    .loader-dots span:nth-child(3) { animation-delay: 0.32s; }

    @keyframes dotPulse {
      0%, 80%, 100% {
        transform: scale(0.6);
        opacity: 0.3;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .error-state {
      text-align: center;
      padding: 40px;
      color: var(--text-tertiary);
      font-size: 14px;
    }

    /* ── Toast ── */
    #toast {
      --toast-accent: #ff4444;
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      pointer-events: none;
      font-size: 14px;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid color-mix(in srgb, var(--toast-accent) 30%, transparent);
      color: var(--text-primary);
      box-shadow: 0 8px 40px color-mix(in srgb, var(--toast-accent) 25%, transparent), 0 0 60px color-mix(in srgb, var(--toast-accent) 8%, transparent);
      opacity: 0;
      transition: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #toast.show {
      animation: toastPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    #toast.hide {
      animation: toastFade 0.35s ease forwards;
    }

    #toast .toast-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--toast-accent), color-mix(in srgb, var(--toast-accent) 70%, #fff));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    #toast .toast-icon svg {
      width: 12px;
      height: 12px;
      fill: #fff;
    }

    #toast .toast-msg {
      color: var(--text-secondary);
    }

    #toast .toast-app {
      color: var(--toast-accent);
    }

    @keyframes toastPop {
      0% {
        opacity: 0;
        transform: translateX(-50%) scale(0.6);
      }
      60% {
        opacity: 1;
        transform: translateX(-50%) scale(1.08);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }
    }

    @keyframes toastFade {
      0% {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateX(-50%) scale(0.85);
      }
    }

    @media (max-width: 860px) {
      .container {
        padding: 16px;
      }
    .hero h1 {
        font-size: 28px;
      }
      .hero-grand {
        padding: 10px 20px;
      }
      .hero-grand-num {
        font-size: 22px;
      }
      .grid {
        gap: 20px;
      }
      .repo-card {
        flex: 0 1 100%;
      }
    }
    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0.4s, opacity 0.4s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .lightbox.open {
      visibility: visible;
      opacity: 1;
      transition: visibility 0s, opacity 0.4s ease;
    }

    .lightbox-bg {
      position: absolute;
      inset: 0;
      background: rgba(4, 4, 12, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      cursor: zoom-out;
    }

    .lightbox.open .lightbox-bg {
      animation: lightboxBgIn 0.5s ease;
    }

    @keyframes lightboxBgIn {
      0% { opacity: 0; backdrop-filter: blur(0); }
      100% { opacity: 1; backdrop-filter: blur(16px); }
    }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 10;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(8, 8, 15, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      opacity: 0;
      transform: translateY(-12px) scale(0.7) rotate(-90deg);
      color: #fff;
      overflow: hidden;
    }

    .lightbox.open .lightbox-close {
      opacity: 1;
      transform: translateY(0) scale(1) rotate(0deg);
      transition-delay: 0.3s;
    }

    .lightbox-close:hover {
      background: var(--lightbox-accent);
      border-color: var(--lightbox-accent);
      transform: scale(1.12) rotate(90deg);
      box-shadow: 0 0 30px color-mix(in srgb, var(--lightbox-accent) 40%, transparent);
    }

    .lightbox-close svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      transition: transform 0.4s ease;
    }

    .lightbox-close:hover svg {
      transform: rotate(90deg);
    }

    .lightbox-counter {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 1.5px;
      padding: 8px 20px;
      border-radius: 20px;
      background: rgba(8, 8, 15, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.04);
      opacity: 0;
      transform: translateX(-50%) translateY(12px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .lightbox.open .lightbox-counter {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      transition-delay: 0.5s;
    }

    .lightbox-stage {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      max-width: 88vw;
      max-height: 82vh;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      transform: scale(0.8);
      opacity: 0;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
      cursor: grab;
    }

    .lightbox.open .lightbox-stage {
      transform: scale(1);
      opacity: 1;
      transition-delay: 0.15s;
    }

    .lightbox-stage:active {
      cursor: grabbing;
    }

    .lightbox-image {
      display: block;
      max-width: 88vw;
      max-height: 82vh;
      width: auto;
      height: auto;
      object-fit: contain;
      transition: transform 0.05s linear;
      position: relative;
      z-index: 1;
      border-radius: 20px;
    }

    /* Animated colored border around image */
    .lightbox-border {
      position: absolute;
      inset: -3px;
      border-radius: 22px;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      overflow: hidden;
    }

    .lightbox.open .lightbox-border {
      opacity: 1;
      transition-delay: 0.35s;
    }

    .lightbox-border-glow {
      position: absolute;
      inset: -3px;
      border-radius: 22px;
      border: 2px solid var(--lightbox-accent);
      z-index: 1;
      animation: lightboxBorderPulse 2.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes lightboxBorderPulse {
      0%, 100% { opacity: 0.35; box-shadow: 0 0 8px var(--lightbox-accent), 0 0 20px transparent; }
      50% { opacity: 0.7; box-shadow: 0 0 20px var(--lightbox-accent), 0 0 50px color-mix(in srgb, var(--lightbox-accent) 15%, transparent); }
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      z-index: 10;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(8, 8, 15, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.35s ease;
      color: #fff;
    }

    .lightbox:hover .lightbox-nav {
      opacity: 0.6;
    }

    .lightbox-nav:hover {
      opacity: 1 !important;
      background: rgba(8, 8, 15, 0.8);
      border-color: var(--lightbox-accent);
      transform: translateY(-50%) scale(1.1);
    }

    .lightbox-nav svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .lightbox-nav--prev { left: 20px; }
    .lightbox-nav--next { right: 20px; }

    .lightbox-zoom-hint {

    function formatSize(bytes) {
      if (!bytes) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      let i = 0;
      let size = bytes;
      while (size >= 1024 && i < units.length - 1) { size /= 1024;
        i++; }
      return `${size.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function repoLabel(repo) {
      return META[repo]?.label || repo.split('/')[1].replace(/-/g, ' ').replace(/(^\w|\s\w)/g, m => m.toUpperCase());
    }

    function getLatestExe(assets) {
      return assets
        .filter(a => a.name.endsWith('.exe'))
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    }

    function exeBtn(asset, accent, isLatest = true) {
      const tag = isLatest ? 'a' : 'div';
      const attrs = isLatest
        ? ` class="exe-btn" href="${asset.browser_download_url}" target="_blank" rel="noopener"`
        : ` class="exe-btn exe-btn--disabled"`;
      return `
        <${tag}${attrs}>
          <div class="exe-icon">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/></svg>
          </div>
          <div class="exe-info">
            <div class="exe-name" title="${asset.name}">${asset.name}</div>
            <div class="exe-meta">
              <span class="exe-size">${formatSize(asset.size)}</span>
              <span class="exe-dl-badge">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                ${asset.download_count.toLocaleString()}
              </span>
            </div>
          </div>
          ${isLatest ? `
          <div class="exe-arrow">
            <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
          </div>` : ''}
        </${tag}>`;
    }

    function installBox(cmd, appName, accent) {
      return `
        <div class="install-box">
          <div class="install-label">Quick Install</div>
          <div class="install-code-wrap" data-app="${appName.replace(/"/g, '&quot;')}" data-accent="${accent}">
            <div class="install-code">${cmd}</div>
            <button class="install-copy" data-cmd="${cmd.replace(/"/g, '&quot;')}">Copy</button>
            <div class="install-overlay">
              <div class="install-overlay-step"><span class="install-overlay-arrow">▸</span> <kbd>Win</kbd>+<kbd>R</kbd> &gt; <code>powershell</code> &gt; Enter &gt; paste &gt; Enter</div>
            </div>
          </div>
        </div>`;
    }

    function buildCard(project, isBonus) {
      const fullRepo = `eaeoz/${project.repo}`;
      const meta = META[fullRepo] || {};
      const accent = meta.accent || '#ff4444';
      const label = meta.label || repoLabel(fullRepo);
      const desc = meta.desc || '';
      const icon = meta.icon || '';
      const repoUrl = `https://github.com/${fullRepo}`;
      const installCmd = meta.cmd ? installBox(meta.cmd, label, accent) : '';
      const stars = project.stars || 0;
      const ownerLogin = project.owner.login;
      const ownerAvatar = project.owner.avatar_url;

      let allExes = [];
      let repoTotal = 0;

      for (const release of project.releases) {
        const assets = (release.assets || []).filter(a => a.name.endsWith('.exe'));
        for (const a of assets) {
          a.download_count = a.downloads;
          a._releaseTag = release.tag;
          a._releaseDate = release.published;
          allExes.push(a);
          repoTotal += a.downloads;
        }
      }

      const allExesSorted = getLatestExe(allExes);
      const releaseCount = new Set(allExes.map(a => a._releaseTag)).size;
      const glowRgb = accent.replace(')', ',0.1)').replace('rgb', 'rgba');

      let bodyHtml = '';

      if (allExesSorted.length > 0) {
        const tagGroups = {};
        for (const exe of allExesSorted) {
          if (!tagGroups[exe._releaseTag]) {
            tagGroups[exe._releaseTag] = { exes: [], releaseDate: exe._releaseDate };
          }
          tagGroups[exe._releaseTag].exes.push(exe);
        }

        const sortedTags = Object.keys(tagGroups).sort(
          (a, b) => new Date(tagGroups[b].releaseDate) - new Date(tagGroups[a].releaseDate)
        );

        for (const tag of sortedTags) {
          tagGroups[tag].exes.sort((a, b) => {
            const aSetup = a.name.includes('Setup');
            const bSetup = b.name.includes('Setup');
            if (aSetup && !bSetup) return -1;
            if (!aSetup && bSetup) return 1;
            return 0;
          });
        }

        const latestExes = tagGroups[sortedTags[0]].exes;
        const olderExes = sortedTags.slice(1).flatMap(tag => tagGroups[tag].exes);

        bodyHtml = '<div class="exe-list">';
        for (const exe of latestExes) {
          bodyHtml += exeBtn(exe, accent, true);
        }

        if (olderExes.length > 0) {
          const olderDownloads = olderExes.reduce((s, e) => s + e.download_count, 0);
          bodyHtml += `
            <div class="exe-toggle" data-target="older-${project.repo}">
              <span class="exe-toggle-arrow">▸</span>
              <span class="exe-toggle-label">${olderExes.length} older release${olderExes.length !== 1 ? 's' : ''}</span>
              <span class="exe-toggle-badge">${olderDownloads.toLocaleString()} dl</span>
            </div>
            <div class="exe-older-wrap" id="older-${project.repo}">
              <div class="exe-older-inner">`;
          for (const exe of olderExes) {
            bodyHtml += exeBtn(exe, accent, false);
          }
          bodyHtml += '</div></div>';
        }

        bodyHtml += '</div>';
      } else {
        bodyHtml = '<div class="no-exe">No executables found</div>';
      }

      const cardClass = isBonus ? 'bonus-card' : 'repo-card';
      const badgeHtml = isBonus ? '<div class="bonus-badge"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> Bonus App</div>' : '';

      return `
        <div class="${cardClass}" style="--accent:${accent};--accent-glow:${glowRgb};--accent-bg:${accent}15;--accent-text:${accent}">
          ${badgeHtml}
          <div class="repo-owner">
            <img class="repo-avatar" src="${ownerAvatar}" alt="${ownerLogin}">
            <span class="repo-owner-name">${ownerLogin}</span>
          </div>
          <div class="repo-card-header">
            ${icon ? `<div class="repo-icon" style="background:${accent};box-shadow:0 4px 16px ${glowRgb}">${icon}</div>` : ''}
            <div class="repo-card-info">
              <div class="repo-card-name">${label}</div>
              ${desc ? `<div class="repo-card-desc">${desc}</div>` : ''}
              <div class="repo-card-sub">
                <span class="repo-card-count">${repoTotal.toLocaleString()} downloads</span>
                <span class="repo-card-releases">${releaseCount} release${releaseCount !== 1 ? 's' : ''}</span>
                ${stars > 0 ? `<span class="star-badge"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>${stars}</span>` : ''}
              </div>
            </div>
          </div>
          ${installCmd}${bodyHtml}
          <div class="repo-footer">
            <a class="repo-link" href="${repoUrl}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12 24 5.37 18.63 0 12 0z"/></svg>
              View Repository
            </a>
          </div>
        </div>`;
    }

    function makeProject(repo) {
      return {
        repo: repo.split('/')[1],
        stars: 0,
        owner: { login: 'eaeoz', avatar_url: 'https://avatars.githubusercontent.com/u/96027693?v=4' },
        releases: [],
      };
    }

    async function loadAll() {
      const app = document.getElementById('app');

      const allRepos = [...REPOS, ...BONUS_REPOS];
      let projectsData;

      try {
        const res = await fetch('https://raw.githubusercontent.com/eaeoz/app-stats/refs/heads/main/public/releases.json');
        if (res.ok) {
          const json = await res.json();
          projectsData = json.projects;
        } else {
          projectsData = [];
        }
      } catch {
        projectsData = [];
      }

      const projectsMap = {};
      for (const p of projectsData) {
        projectsMap[`eaeoz/${p.repo}`] = p;
      }

      let grandTotal = 0;
      let cardsHtml = '';
      let bonusCardsHtml = '';

      for (const fullRepo of allRepos) {
        const isBonus = BONUS_REPOS.includes(fullRepo);
        const project = projectsMap[fullRepo] || makeProject(fullRepo);
        const cardHtml = buildCard(project, isBonus);

        let repoTotal = 0;
        for (const release of project.releases) {
          const assets = (release.assets || []).filter(a => a.name.endsWith('.exe'));
          for (const a of assets) {
            repoTotal += a.downloads;
          }
        }
        grandTotal += repoTotal;

        if (isBonus) {
          bonusCardsHtml += cardHtml;
        } else {
          cardsHtml += cardHtml;
        }
      }

      const totalApps = allRepos.length;

      const hero = `
        <div class="hero">
          <h1>${totalApps} Free <span>Apps Bundle</span></h1>
          <p>Live download tracker for all projects</p>
          <p id="lastUpdated" style="font-size:12px;color:var(--text-muted);margin-top:4px"></p>
          ${totalApps > 1 ? `
          <div class="hero-grand">
            <span class="hero-grand-label">Grand Total</span>
            <span class="hero-grand-num" id="grandTotal">0</span>
          </div>` : ''}
        </div>`;

      const footerHtml = `
        <footer class="app-footer">
          <hr class="footer-hr">
          <div class="footer-links">
            <a class="footer-link footer-link--web" href="https://eaeoz.github.io/5_Free_Apps_Bundle/contact" target="_blank" rel="noopener" aria-label="Contact">
              <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
              <span class="tooltip">Contact</span>
            </a>
            <a class="footer-link footer-link--linkedin" href="https://www.linkedin.com/in/sedatergoz" target="_blank" rel="noopener" aria-label="LinkedIn">
              <svg viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14zm-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79zM6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68zm1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
              <span class="tooltip">LinkedIn</span>
            </a>
            <a class="footer-link footer-link--github" href="https://github.com/eaeoz" target="_blank" rel="noopener" aria-label="GitHub">
              <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12 24 5.37 18.63 0 12 0z"/></svg>
              <span class="tooltip">GitHub</span>
            </a>
          </div>
          <p class="footer-credit" style="margin-bottom:8px">${totalApps} Free Apps Bundle &middot; Built with passion</p>
          <p class="footer-credit" style="font-size:11px"><a href="privacy.html" style="color:var(--text-muted);text-decoration:none;transition:color 0.25s" onmouseover="this.style.color='var(--text-tertiary)'" onmouseout="this.style.color='var(--text-muted)'">Privacy Policy</a></p>
        </footer>`;

      const allReposShort = REPOS.map(r => META[r]?.short || '').filter(Boolean);

      const bulkCmd = `"${allReposShort.join('","')}" | ForEach-Object { iex (iwr -useb "https://tinyurl.com/$_") }`;
      const bulkHtml = `
        <div class="bulk-install">
          <div class="bulk-install-label">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>

            <span class="bulk-install-tag"><svg viewBox="0 0 24 24" style="width:10px;height:10px;fill:currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg> 1-Click</span>
          </div>
          <div class="bulk-install-box" id="bulkInstallBox">
            <div class="bulk-install-shine"></div>
            <div class="bulk-install-code">${bulkCmd}</div>
            <button class="bulk-install-copy" id="bulkInstallCopy" data-cmd='${bulkCmd.replace(/"/g, '&quot;')}'>Copy</button>

              <div class="bulk-install-overlay-step"><kbd>Win</kbd>+<kbd>R</kbd> &rarr; <code>powershell</code> &rarr; <kbd>Enter</kbd></div>
              <div class="bulk-install-overlay-step">Paste &rarr; <kbd>Enter</kbd> &rarr; All ${REPOS.length} apps install</div>
            </div>
          </div>
        </div>`;

      const bonusSection = bonusCardsHtml ? `
        <section class="bonus-section">
          <hr class="bonus-divider">
          <div class="bonus-header">
            <h2>Bonus <span>Apps</span></h2>
            <p>Extra tools to supercharge your workflow</p>
          </div>
          <div class="bonus-grid" id="bonusGrid">${bonusCardsHtml}</div>
        </section>` : '';

      app.innerHTML = hero + getSliderHtml() + bulkHtml + `<div class="grid" id="grid">${cardsHtml}</div>` + bonusSection + footerHtml;

      // Animate grand total
      if (totalApps > 1) {
        const el = document.getElementById('grandTotal');
        let current = 0;
        const step = Math.max(1, Math.floor(grandTotal / 40));
        const interval = setInterval(() => {
          current += step;
          if (current >= grandTotal) {
            current = grandTotal;
            clearInterval(interval);
          }
          el.textContent = current.toLocaleString();
        }, 30);
      }

      // Slider entrance animation
      const sliderSection = document.getElementById('sliderSection');
      setTimeout(() => sliderSection.classList.add('visible'), 100);

      // Init slider
      initSlider();

      // Staggered card entrance
      const cards = document.querySelectorAll('.repo-card');
      cards.forEach((card, i) => {
        setTimeout(() => card.classList.add('visible'), 150 + i * 100);
      });

      const bonusCards = document.querySelectorAll('.bonus-card');
      bonusCards.forEach((card, i) => {
        setTimeout(() => card.classList.add('visible'), 150 + (cards.length + i) * 100);
      });

      // Install overlay: show on hover, auto-hide after 4s
      document.querySelectorAll('.install-code-wrap').forEach(wrap => {
        const cmd = wrap.querySelector('.install-copy').dataset.cmd;
        const appName = wrap.dataset.app;
        const accent = wrap.dataset.accent;
        wrap.addEventListener('click', () => {
          navigator.clipboard.writeText(cmd).then(() => {
            const btn = wrap.querySelector('.install-copy');
            const orig = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = orig, 1500);
            showToast(appName, accent);
          });
        });
        wrap.addEventListener('mouseenter', () => {
          const overlay = wrap.querySelector('.install-overlay');
          if (!overlay || overlay.classList.contains('show')) return;
          overlay.classList.add('show');
          setTimeout(() => overlay.classList.remove('show'), 4000);
        });
      });

      // Bulk install copy
      const bulkBox = document.getElementById('bulkInstallBox');
      const bulkCopy = document.getElementById('bulkInstallCopy');
      const bulkOverlay = document.getElementById('bulkInstallOverlay');
      if (bulkBox && bulkCopy) {
        const cmd = bulkCopy.dataset.cmd;
        bulkBox.addEventListener('click', (e) => {
          if (e.target === bulkCopy) return;
          navigator.clipboard.writeText(cmd).then(() => {
            const orig = bulkCopy.textContent;
            bulkCopy.textContent = 'Copied!';
            setTimeout(() => bulkCopy.textContent = orig, 1500);
            showToast(`All ${REPOS.length} Apps`, '#ff4444');
          });
        });
        bulkCopy.addEventListener('click', (e) => {
          e.stopPropagation();
          navigator.clipboard.writeText(cmd).then(() => {
            const orig = bulkCopy.textContent;
            bulkCopy.textContent = 'Copied!';
            setTimeout(() => bulkCopy.textContent = orig, 1500);
            showToast(`All ${REPOS.length} Apps`, '#ff4444');
          });
        });
        bulkBox.addEventListener('mouseenter', () => {
          if (!bulkOverlay || bulkOverlay.classList.contains('show')) return;
          bulkOverlay.classList.add('show');
          setTimeout(() => bulkOverlay.classList.remove('show'), 4000);
        });
      }

      // Toggle older releases dropdown
      document.querySelectorAll('.exe-toggle').forEach(tog => {
        tog.addEventListener('click', () => {
          const wrap = document.getElementById(tog.dataset.target);
          const isOpen = wrap.classList.toggle('open');
          tog.classList.toggle('open');
          tog.querySelector('.exe-toggle-arrow').textContent = isOpen ? '▾' : '▸';
          const count = wrap.querySelectorAll('.exe-btn--disabled').length;
          tog.querySelector('.exe-toggle-label').textContent = isOpen
            ? 'Hide older releases'
            : `${count} older release${count !== 1 ? 's' : ''}`;
        });
      });
    }

    function showToast(appName, accent) {
      const t = document.getElementById('toast');
      t.className = '';
      t.style.setProperty('--toast-accent', accent);
      t.innerHTML = `<div class="toast-icon"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg></div><span class="toast-msg"><span class="toast-app">${appName}</span> install command copied</span>`;
      void t.offsetWidth;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => {
        t.classList.remove('show');
        t.classList.add('hide');
        setTimeout(() => { t.className = ''; }, 400);
      }, 2200);
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function getSliderHtml() {
      return `<div class="slider-section" id="sliderSection">
        <div class="slider-wrapper" id="sliderWrapper">
          <div class="slider-viewport">
            <div class="slider-track" id="sliderTrack">
              ${SLIDER_ITEMS.map((item, i) => {
                const meta = META[item.key] || {};
                const accent = meta.accent || '#ff4444';
                return `<div class="slider-slide${i === 0 ? ' active' : ''}" data-accent="${accent}" data-index="${i}">
                  <style>#sliderWrapper{--accent-${i}:${accent};--accent-${i}-trans:${hexToRgba(accent, 0.35)}}</style>
                  <div class="slider-glow" style="background:radial-gradient(circle at 50% 50%, var(--accent-${i}) 0%, transparent 65%)"></div>
                  <div class="slider-image-hint"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg> View full size</div>
                  <img class="slider-image" src="${item.src}" alt="${item.label}" loading="${i === 0 ? 'eager' : 'lazy'}">
                  <div class="slider-image-glow-border" style="--slider-accent-trans:var(--accent-${i}-trans)"></div>
                  <div class="slider-overlay">
                    <div class="slider-label">${item.label} <span class="slider-label-badge" style="background:var(--accent-${i})">${item.label.split(' ').slice(0, 2).join(' ')}</span></div>
                  </div>
                </div>`;
              }).join('')}
            </div>
            <button class="slider-arrow slider-arrow--prev" id="sliderPrev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
            <button class="slider-arrow slider-arrow--next" id="sliderNext" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>
            <div class="slider-progress" id="sliderProgress"></div>
          </div>
          <div class="slider-dots" id="sliderDots">
            ${SLIDER_ITEMS.map((_, i) => `<button class="slider-dot${i === 0 ? ' active' : ''}" data-index="${i}" aria-label="Slide ${i + 1}"></button>`).join('')}
          </div>
        </div>
      </div>`;
    }

    function initSlider() {
      const track = document.getElementById('sliderTrack');
      const dots = document.querySelectorAll('.slider-dot');
      const slides = document.querySelectorAll('.slider-slide');
      const prevBtn = document.getElementById('sliderPrev');
      const nextBtn = document.getElementById('sliderNext');
      const wrapper = document.getElementById('sliderWrapper');
      const progress = document.getElementById('sliderProgress');
      if (!track || !slides.length) return;

      let current = 0;
      let autoplayTimer;
      let autoplayPending = false;
      const AUTOPLAY_DELAY = 4500;
      const total = slides.length;
      let touchMoved = false;

      function goTo(index) {
        if (index === current) return;
        slides.forEach(s => s.classList.remove('active'));
        dots.forEach(d => d.classList.remove('active'));
        current = index;
        track.style.transform = `translateX(-${index * 100}%)`;
        slides[index].classList.add('active');
        dots[index].classList.add('active');
        const accent = slides[index].dataset.accent;
        wrapper.style.setProperty('--slider-accent', accent);
        progress.style.background = accent;
        progress.style.boxShadow = `0 0 14px ${accent}, 0 0 30px color-mix(in srgb, ${accent} 25%, transparent)`;
        resetProgress();
      }

      function next() { goTo((current + 1) % total); }
      function prev() { goTo((current - 1 + total) % total); }

      function startAutoplay() {
        stopAutoplay();
        autoplayPending = true;
        autoplayTimer = setTimeout(function tick() {
          if (!autoplayPending) return;
          next();
          autoplayTimer = setTimeout(tick, AUTOPLAY_DELAY);
        }, AUTOPLAY_DELAY);
      }
      function stopAutoplay() {
        autoplayPending = false;
        clearTimeout(autoplayTimer);
      }

      function resetProgress() {
        progress.style.transition = 'none';
        progress.style.width = '0%';
        void progress.offsetWidth;
        progress.style.transition = 'width 4.4s linear';
        progress.style.width = '100%';
      }

      // Open lightbox on tap/click
      let touchTap = false;
      slides.forEach((slide, i) => {
        // Empty touchstart tells iOS Safari this is an interactive element
        slide.addEventListener('touchstart', () => { touchTap = false; }, { passive: true });
        slide.addEventListener('touchmove', () => { touchTap = true; }, { passive: true });
        slide.addEventListener('touchend', () => {
          if (touchMoved || touchTap) return;
          touchTap = true;
          stopAutoplay();
          lbOpen(i);
        }, { passive: true });
        slide.addEventListener('click', () => {
          if (touchMoved || touchTap) return;
          stopAutoplay();
          lbOpen(i);
        });
      });

      prevBtn.addEventListener('click', () => { stopAutoplay(); prev(); startAutoplay(); });
      nextBtn.addEventListener('click', () => { stopAutoplay(); next(); startAutoplay(); });

      dots.forEach(dot => {
        dot.addEventListener('click', () => {
          const idx = parseInt(dot.dataset.index);
          if (idx !== current) { stopAutoplay(); goTo(idx); startAutoplay(); }
        });
      });

      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') { stopAutoplay(); prev(); startAutoplay(); }
        if (e.key === 'ArrowRight') { stopAutoplay(); next(); startAutoplay(); }
      });

      wrapper.addEventListener('mouseenter', stopAutoplay);
      wrapper.addEventListener('mouseleave', startAutoplay);

      // Touch drag (mobile only)
      const viewport = document.querySelector('.slider-viewport');
      let touchStartX = 0, touchOffset = 0;

      viewport.addEventListener('touchstart', e => {
        if (e.touches.length !== 1) return;
        touchMoved = false;
        touchStartX = e.touches[0].clientX;
        touchOffset = 0;
        track.classList.add('dragging');
        stopAutoplay();
      }, { passive: true });

      viewport.addEventListener('touchmove', e => {
        if (e.touches.length !== 1) return;
        const dx = e.touches[0].clientX - touchStartX;
        if (Math.abs(dx) > 5) touchMoved = true;
        touchOffset = dx;
        const vw = viewport.offsetWidth;
        track.style.transform = `translateX(${-current * vw + dx}px)`;
      }, { passive: true });

      viewport.addEventListener('touchend', () => {
        track.classList.remove('dragging');
        if (touchMoved) {
          const vw = viewport.offsetWidth;
          if (touchOffset < -vw * 0.25) next();
          else if (touchOffset > vw * 0.25) prev();
          else goTo(current);
        }
        startAutoplay();
      }, { passive: true });

      // Set initial accent
      const initialAccent = slides[0].dataset.accent;
      wrapper.style.setProperty('--slider-accent', initialAccent);
      progress.style.background = initialAccent;
      progress.style.boxShadow = `0 0 12px ${initialAccent}`;
      resetProgress();
      startAutoplay();
    }

    function updateTimestamp() {
      const el = document.getElementById('lastUpdated');
      if (el) el.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
    }

    /* ── Lightbox ── */
    let lbIndex = 0;
    let lbZoom = 1;
    let lbPanX = 0;
    let lbPanY = 0;
    let lbDragging = false;
    let lbDragStartX = 0;
    let lbDragStartY = 0;
    let lbPanStartX = 0;
    let lbPanStartY = 0;

    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightboxImage');
    const lbBg = document.getElementById('lightboxBg');
    const lbStage = document.getElementById('lightboxStage');
    const lbClose = document.getElementById('lightboxClose');
    const lbCounter = document.getElementById('lightboxCounter');
    const lbBorder = document.getElementById('lightboxBorder');
    const lbNavPrev = document.getElementById('lightboxNavPrev');
    const lbNavNext = document.getElementById('lightboxNavNext');

    function lbUpdateTransform() {
      lbImg.style.transform = `translate(${lbPanX}px, ${lbPanY}px) scale(${lbZoom})`;
    }

    function lbOpen(index) {
      const slides = document.querySelectorAll('.slider-slide');
      if (!slides[index]) return;
      const slide = slides[index];
      const img = slide.querySelector('.slider-image');
      const accent = slide.dataset.accent || '#ff4444';

      lbIndex = index;
      lbZoom = 1;
      lbPanX = 0;
      lbPanY = 0;
      lbImg.src = img.src;
      lbImg.alt = img.alt;
      lbUpdateTransform();
      lb.style.setProperty('--lightbox-accent', accent);
      lbBorder.style.setProperty('--lightbox-accent', accent);
      lbCounter.textContent = `${index + 1} / ${slides.length}`;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
      document.body.style.touchAction = 'none';
    }

    function lbCloseFn() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
      document.body.style.touchAction = '';
      lbZoom = 1;
      lbPanX = 0;
      lbPanY = 0;
    }

    function lbNext() {
      const slides = document.querySelectorAll('.slider-slide');
      const next = (lbIndex + 1) % slides.length;
      lbOpen(next);
    }

    function lbPrev() {
      const slides = document.querySelectorAll('.slider-slide');
      const prev = (lbIndex - 1 + slides.length) % slides.length;
      lbOpen(prev);
    }

    lbBg.addEventListener('click', lbCloseFn);
    lbClose.addEventListener('click', lbCloseFn);

    lbNavNext.addEventListener('click', lbNext);
    lbNavPrev.addEventListener('click', lbPrev);

    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') { lbCloseFn(); return; }
      if (e.key === 'ArrowRight') { lbNext(); return; }
      if (e.key === 'ArrowLeft') { lbPrev(); return; }
    });

    lbStage.addEventListener('wheel', e => {
      if (!lb.classList.contains('open')) return;
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.1 : 0.1;
      lbZoom = Math.max(0.5, Math.min(6, parseFloat((lbZoom + delta).toFixed(2))));
      lbUpdateTransform();
    }, { passive: false });

    lbStage.addEventListener('mousedown', e => {
      if (e.button === 0 || e.button === 1) {
        lbDragging = true;
        lbDragStartX = e.clientX;
        lbDragStartY = e.clientY;
        lbPanStartX = lbPanX;
        lbPanStartY = lbPanY;
        e.preventDefault();
      }
    });

    document.addEventListener('mousemove', e => {
      if (!lbDragging) return;
      lbPanX = lbPanStartX + (e.clientX - lbDragStartX) / lbZoom;
      lbPanY = lbPanStartY + (e.clientY - lbDragStartY) / lbZoom;
      lbUpdateTransform();
    });

    document.addEventListener('mouseup', () => { lbDragging = false; });

    // Touch support for mobile
    let lbTouchStartX = 0;
    let lbTouchStartY = 0;
    let lbTouchDist = 0;
    let lbTouching = false;

    lbStage.addEventListener('touchstart', e => {
      if (!lb.classList.contains('open')) return;
      e.preventDefault();
      if (e.touches.length === 1) {
        lbTouching = true;
        lbTouchStartX = e.touches[0].clientX;
        lbTouchStartY = e.touches[0].clientY;
        lbPanStartX = lbPanX;
        lbPanStartY = lbPanY;
      } else if (e.touches.length === 2) {
        lbTouchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: false });

    lbStage.addEventListener('touchmove', e => {
      if (!lb.classList.contains('open')) return;
      e.preventDefault();
      if (e.touches.length === 1 && lbTouching) {
        lbPanX = lbPanStartX + (e.touches[0].clientX - lbTouchStartX) / lbZoom;
        lbPanY = lbPanStartY + (e.touches[0].clientY - lbTouchStartY) / lbZoom;
        lbUpdateTransform();
      } else if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (lbTouchDist) {
          lbZoom = Math.max(0.5, Math.min(6, lbZoom * (dist / lbTouchDist)));
          lbUpdateTransform();
        }
        lbTouchDist = dist;
      }
    }, { passive: false });

    lbStage.addEventListener('touchend', e => {
      if (!lb.classList.contains('open')) return;
      e.preventDefault();
      lbTouching = false;
    }, { passive: false });

    // Theme toggle
    (function() {
      function g(){var m=location.search.match(/[?&]theme=(light|dark)(&|$)/);if(m)return m[1];try{var v=localStorage.getItem('theme');if(v)return v}catch(e){}try{var d=JSON.parse(window.name);if(d&&d.theme)return d.theme}catch(e){}return null}
      function s(v){try{localStorage.setItem('theme',v)}catch(e){}try{var d=JSON.parse(window.name)||{};d.theme=v;window.name=JSON.stringify(d)}catch(e){}}
      function u(v){try{document.querySelectorAll('a[href]').forEach(function(a){var h=a.getAttribute('href');if(!h||h.startsWith('#')||h.startsWith('http')||h.startsWith('//')||h.startsWith('mailto'))return;var b=h.split('?')[0],p=(h.split('?')[1]||'').split('&').filter(function(x){return!x.startsWith('theme=')}).join('&');        if(v==='light'){p=p?p+'&theme=light':'theme=light';a.href=b+'?'+p}else{a.href=p?b+'?'+p:b}})}catch(e){}}
      try {
        const toggle = document.getElementById('themeToggle');
        if (!toggle) return;
        const stored = g();
        if (stored === 'light') document.documentElement.setAttribute('data-theme', 'light');
        u(stored||'dark');
        toggle.addEventListener('click', () => {
          const isLight = document.documentElement.getAttribute('data-theme') === 'light';
          const next = isLight ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', next);
          s(next);
          u(next);
          try{var u2=new URL(window.location);if(next==='light')u2.searchParams.set('theme','light');else u2.searchParams.delete('theme');history.replaceState(null,'',u2.pathname+u2.search)}catch(e){}
        });
      } catch(e) {}
    })();

    loadAll().then(updateTimestamp, updateTimestamp);
    setInterval(() => loadAll().then(updateTimestamp, updateTimestamp), 600000);
  </script>

</body>
</html>

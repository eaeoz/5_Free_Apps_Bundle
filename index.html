<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #08080f;
      min-height: 100vh;
      padding: 32px;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .bg-glow::before {
      content: '';
      position: absolute;
      top: -20%;
      left: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(255, 68, 68, 0.06), transparent 60%);
      animation: glowDrift 12s ease-in-out infinite alternate;
    }

    .bg-glow::after {
      content: '';
      position: absolute;
      bottom: -20%;
      right: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.05), transparent 60%);
      animation: glowDrift 14s ease-in-out infinite alternate-reverse;
    }

    @keyframes glowDrift {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(60px, 40px) scale(1.2);
      }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ── Hero Header ── */
    .hero {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeDown 0.8s ease-out;
    }

    .hero h1 {
      font-size: 42px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -1.5px;
      line-height: 1.15;
    }

    .hero h1 span {
      background: linear-gradient(135deg, #ff4444, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      color: rgba(255, 255, 255, 0.35);
      font-size: 15px;
      font-weight: 500;
      margin-top: 8px;
    }

    .hero-grand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-top: 20px;
      padding: 14px 32px;
      background: rgba(255, 68, 68, 0.06);
      border: 1px solid rgba(255, 68, 68, 0.12);
      border-radius: 60px;
      backdrop-filter: blur(8px);
    }

    .hero-grand-label {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .hero-grand-num {
      font-size: 28px;
      font-weight: 900;
      color: #ff4444;
      letter-spacing: -1px;
    }

    /* ── Repo Grid ── */
    .grid {
      display: flex;
      flex-flow: row wrap;
      justify-content: center;
      gap: 28px;
    }

    /* ── Repo Card ── */
    .repo-card {
      flex: 0 1 360px;
      background: linear-gradient(160deg, rgba(26, 26, 46, 0.7), rgba(22, 33, 62, 0.7));
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
      opacity: 0;
      transform: translateY(40px) scale(0.96);
      position: relative;
      overflow: hidden;
    }

    .repo-card.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .repo-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .repo-card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 16px 60px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
    }

    .repo-card:hover::before {
      opacity: 1;
    }

    .repo-owner {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 18px;
      text-align: center;
    }

    .repo-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      animation: avatarPulse 3s ease-in-out infinite;
      transition: transform 0.4s ease;
    }

    .repo-card:hover .repo-avatar {
      transform: scale(1.1);
    }

    @keyframes avatarPulse {
      0%, 100% { box-shadow: 0 0 12px var(--accent-glow); }
      50% { box-shadow: 0 0 28px var(--accent-glow), 0 0 60px var(--accent-glow); }
    }

    .repo-owner-name {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 6px;
      letter-spacing: 0.2px;
    }

    .repo-card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .repo-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--accent);
      box-shadow: 0 4px 16px var(--accent-glow);
      transition: transform 0.3s ease;
    }

    .repo-card:hover .repo-icon {
      transform: scale(1.08) rotate(-4deg);
    }

    .repo-icon svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }

    .repo-card-info {
      flex: 1;
      min-width: 0;
    }

    .repo-card-name {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .repo-card-sub {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .repo-card-count {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-text);
      background: var(--accent-bg);
      padding: 2px 10px;
      border-radius: 20px;
    }

    .repo-card-releases {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.3);
      font-weight: 500;
    }

    /* ── Executable Buttons ── */
    .exe-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .exe-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .exe-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.04), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }

    .exe-btn:hover::after {
      transform: translateX(100%);
    }

    .exe-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--accent);
      transform: translateX(4px);
    }

    .exe-btn:active {
      transform: translateX(4px) scale(0.98);
    }

    .exe-btn--disabled {
      cursor: default;
    }

    .exe-btn--disabled:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.06);
      transform: none;
    }

    .exe-btn--disabled:hover::after {
      transform: translateX(-100%);
    }

    /* ── Older Releases Toggle ── */
    .exe-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      margin: 2px 0;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.25s ease;
      user-select: none;
    }

    .exe-toggle:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .exe-toggle-arrow {
      font-size: 8px;
      color: rgba(255, 255, 255, 0.25);
      transition: transform 0.35s ease;
      flex-shrink: 0;
    }

    .exe-toggle.open .exe-toggle-arrow {
      transform: rotate(90deg);
    }

    .exe-toggle-label {
      flex: 1;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.3);
      transition: color 0.25s ease;
    }

    .exe-toggle:hover .exe-toggle-label {
      color: rgba(255, 255, 255, 0.55);
    }

    .exe-toggle-badge {
      font-size: 10px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      padding: 2px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
    }

    .exe-older-wrap {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .exe-older-wrap.open {
      grid-template-rows: 1fr;
    }

    .exe-older-inner {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 2px;
    }

    .exe-older-inner .exe-btn {
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .exe-older-wrap.open .exe-older-inner .exe-btn {
      opacity: 1;
      transform: translateY(0);
    }

    .exe-older-wrap.open .exe-older-inner .exe-btn:nth-child(1) { transition-delay: 0.03s; }
    .exe-older-wrap.open .exe-older-inner .exe-btn:nth-child(2) { transition-delay: 0.06s; }
    .exe-older-wrap.open .exe-older-inner .exe-btn:nth-child(3) { transition-delay: 0.09s; }
    .exe-older-wrap.open .exe-older-inner .exe-btn:nth-child(4) { transition-delay: 0.12s; }
    .exe-older-wrap.open .exe-older-inner .exe-btn:nth-child(5) { transition-delay: 0.15s; }
    .exe-older-wrap.open .exe-older-inner .exe-btn:nth-child(6) { transition-delay: 0.18s; }
    .exe-older-wrap.open .exe-older-inner .exe-btn:nth-child(7) { transition-delay: 0.21s; }
    .exe-older-wrap.open .exe-older-inner .exe-btn:nth-child(8) { transition-delay: 0.24s; }

    .exe-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .exe-icon svg {
      width: 14px;
      height: 14px;
      fill: rgba(255, 255, 255, 0.4);
    }

    .exe-info {
      flex: 1;
      min-width: 0;
    }

    .exe-name {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .repo-footer {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.25s ease;
    }

    .repo-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
    }

    .repo-link svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .star-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.35);
    }

    .star-badge svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    .install-box {
      margin-top: 14px;
      margin-bottom: 14px;
      position: relative;
    }

    .install-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.25);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .install-label::before {
      content: '\26A1';
      font-size: 11px;
    }

    .install-code-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
    }

    .install-code {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.55);
      overflow-x: auto;
      white-space: nowrap;
      transition: color 0.3s ease;
      user-select: all;
    }

    .install-code-wrap:hover .install-code {
      color: rgba(255, 255, 255, 0.85);
    }

    .install-copy {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease, background 0.2s ease;
      font-family: inherit;
    }

    .install-copy:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .install-code-wrap:hover .install-copy {
      opacity: 1;
    }

    .install-overlay {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: rgba(8, 8, 15, 0.94);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 10;
    }

    .install-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .install-overlay-step {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .install-overlay-step code {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 9px;
      color: var(--accent);
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 5px;
      border-radius: 3px;
    }

    .install-overlay-step kbd {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 9px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .install-overlay-arrow {
      color: rgba(255, 255, 255, 0.15);
      font-size: 11px;
    }

    .exe-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .exe-size {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.25);
      font-weight: 500;
    }

    .exe-dl-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-text);
      background: var(--accent-bg);
      padding: 1px 8px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .exe-dl-badge svg {
      width: 10px;
      height: 10px;
      fill: currentColor;
    }

    .exe-arrow {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      opacity: 0;
      transform: translateX(-6px);
      transition: all 0.25s ease;
    }

    .exe-arrow svg {
      width: 16px;
      height: 16px;
      fill: var(--accent);
    }

    .exe-btn:hover .exe-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .no-exe {
      padding: 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.2);
      font-size: 13px;
      font-weight: 500;
    }

    /* ── Animations ── */
    @keyframes fadeDown {
      0% {
        opacity: 0;
        transform: translateY(-20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes countUp {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .count-anim {
      display: inline-block;
      animation: countUp 0.5s ease-out both;
    }

    /* ── Loading ── */
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      gap: 20px;
    }

    .loader-ring {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.04);
      border-top-color: #ff4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      color: rgba(255, 255, 255, 0.25);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .loader-dots span {
      display: inline-block;
      animation: dotPulse 1.4s ease-in-out infinite both;
      font-size: 20px;
      line-height: 1;
    }

    .loader-dots span:nth-child(1) { animation-delay: 0s; }
    .loader-dots span:nth-child(2) { animation-delay: 0.16s; }
    .loader-dots span:nth-child(3) { animation-delay: 0.32s; }

    @keyframes dotPulse {
      0%, 80%, 100% {
        transform: scale(0.6);
        opacity: 0.3;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .error-state {
      text-align: center;
      padding: 40px;
      color: rgba(255, 255, 255, 0.3);
      font-size: 14px;
    }

    @media (max-width: 860px) {
      body {
        padding: 16px;
      }
      .hero h1 {
        font-size: 28px;
      }
      .hero-grand {
        padding: 10px 20px;
      }
      .hero-grand-num {
        font-size: 22px;
      }
      .grid {
        gap: 20px;
      }
      .repo-card {
        flex: 0 1 100%;
      }
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="container" id="app">
    <div class="loader">
      <div class="loader-ring"></div>
      <div class="loader-text">Loading dashboard</div>
      <div class="loader-dots"><span>.</span><span>.</span><span>.</span></div>
    </div>
  </div>

  <script>
    const REPOS = [
      'eaeoz/youtube-downloader',
      'eaeoz/movie-downloader',
      'eaeoz/music-downloader',
      'eaeoz/command-manager-docker',
      'eaeoz/sondakika',
    ];

    const META = {

        icon: `<svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>`,

      'eaeoz/movie-downloader': {
        label: 'Movie Downloader',
        icon: `<svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4a2 2 0 0 0-1.99 2L2 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V4h-4z"/></svg>`,
        accent: '#e50914',
        cmd: 'iex (iwr -useb https://tinyurl.com/mvdlps1)',
      },
      'eaeoz/music-downloader': {
        label: 'Music Downloader',
        icon: `<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`,
        accent: '#1ed760',
        cmd: 'iex (iwr -useb https://tinyurl.com/msdlps1)',
      },
      'eaeoz/command-manager-docker': {
        label: 'Command Manager',
        icon: `<svg viewBox="0 0 24 24"><path d="M13 9h-2V7h2v2zm0 4h-2v-2h2v2zm4 0h-2v-2h2v2zm-8 0H7v-2h2v2zm-4 4h2v2H5v-2zm8 2h-2v-2h2v2zm4-2h-2v-2h2v2zm4-8h-2V7h2v2zm0 4h-2v-2h2v2zm-4-4h-2V7h2v2zM3 5h18V3H3v2zm0 16h18v-2H3v2z"/></svg>`,
        accent: '#0db7ed',
        cmd: 'iex (iwr -useb https://tinyurl.com/cmmgrps1)',
      },
      'eaeoz/sondakika': {
        label: 'Sondakika',
        icon: `<svg viewBox="0 0 24 24"><path d="M11 17h2v-6h-2v6zm1-15C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zM11 9h2V7h-2v2z"/></svg>`,
        accent: '#f59e0b',
        cmd: 'iex (iwr -useb https://tinyurl.com/sndkkps1)',
      },
    };

    function formatSize(bytes) {
      if (!bytes) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      let i = 0;
      let size = bytes;
      while (size >= 1024 && i < units.length - 1) { size /= 1024;
        i++; }
      return `${size.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function repoLabel(repo) {
      return META[repo]?.label || repo.split('/')[1].replace(/-/g, ' ').replace(/(^\w|\s\w)/g, m => m.toUpperCase());
    }

    function getLatestExe(assets) {
      return assets
        .filter(a => a.name.endsWith('.exe'))
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    }

    function exeBtn(asset, accent, isLatest = true) {
      const tag = isLatest ? 'a' : 'div';
      const attrs = isLatest
        ? ` class="exe-btn" href="${asset.browser_download_url}" target="_blank" rel="noopener"`
        : ` class="exe-btn exe-btn--disabled"`;
      return `
        <${tag}${attrs}>
          <div class="exe-icon">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/></svg>
          </div>
          <div class="exe-info">
            <div class="exe-name" title="${asset.name}">${asset.name}</div>
            <div class="exe-meta">
              <span class="exe-size">${formatSize(asset.size)}</span>
              <span class="exe-dl-badge">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                ${asset.download_count.toLocaleString()}
              </span>
            </div>
          </div>
          ${isLatest ? `
          <div class="exe-arrow">
            <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
          </div>` : ''}
        </${tag}>`;
    }

    function installBox(cmd) {
      return `
        <div class="install-box">
          <div class="install-label">Quick Install</div>
          <div class="install-code-wrap">
            <div class="install-code">${cmd}</div>
            <button class="install-copy" data-cmd="${cmd.replace(/"/g, '&quot;')}">Copy</button>
            <div class="install-overlay">
              <div class="install-overlay-step"><span class="install-overlay-arrow">▸</span> <kbd>Win</kbd>+<kbd>R</kbd> &gt; <code>powershell</code> &gt; Enter &gt; paste &gt; Enter</div>
            </div>
          </div>
        </div>`;
    }

    async function loadAll() {
      const app = document.getElementById('app');

      const res = await fetch('https://raw.githubusercontent.com/eaeoz/app-stats/refs/heads/main/public/releases.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();

      let grandTotal = 0;
      let cardsHtml = '';
      let toggleId = 0;

      for (const project of json.projects) {
        const fullRepo = `eaeoz/${project.repo}`;
        if (!REPOS.includes(fullRepo)) continue;

        const meta = META[fullRepo] || {};
        const accent = meta.accent || '#ff4444';
        const label = meta.label || repoLabel(fullRepo);
        const icon = meta.icon || '';
        const repoUrl = `https://github.com/${fullRepo}`;
        const installCmd = meta.cmd ? installBox(meta.cmd) : '';
        const stars = project.stars || 0;
        const ownerLogin = project.owner.login;
        const ownerAvatar = project.owner.avatar_url;

        let allExes = [];
        let repoTotal = 0;

        for (const release of project.releases) {
          const assets = (release.assets || []).filter(a => a.name.endsWith('.exe'));
          for (const a of assets) {
            a.download_count = a.downloads;
            a._releaseTag = release.tag;
            a._releaseDate = release.published;
            allExes.push(a);
            repoTotal += a.downloads;
          }
        }

        grandTotal += repoTotal;
        const allExesSorted = getLatestExe(allExes);
        const releaseCount = new Set(allExes.map(a => a._releaseTag)).size;

        const glowRgb = accent.replace(')', ',0.1)').replace('rgb', 'rgba');

        let bodyHtml = '';
        toggleId++;

        if (allExesSorted.length > 0) {
          const tagGroups = {};
          for (const exe of allExesSorted) {
            if (!tagGroups[exe._releaseTag]) {
              tagGroups[exe._releaseTag] = { exes: [], releaseDate: exe._releaseDate };
            }
            tagGroups[exe._releaseTag].exes.push(exe);
          }

          const sortedTags = Object.keys(tagGroups).sort(
            (a, b) => new Date(tagGroups[b].releaseDate) - new Date(tagGroups[a].releaseDate)
          );

          for (const tag of sortedTags) {
            tagGroups[tag].exes.sort((a, b) => {
              const aSetup = a.name.includes('Setup');
              const bSetup = b.name.includes('Setup');
              if (aSetup && !bSetup) return -1;
              if (!aSetup && bSetup) return 1;
              return 0;
            });
          }

          const latestExes = tagGroups[sortedTags[0]].exes;
          const olderExes = sortedTags.slice(1).flatMap(tag => tagGroups[tag].exes);

          bodyHtml = '<div class="exe-list">';
          for (const exe of latestExes) {
            bodyHtml += exeBtn(exe, accent, true);
          }

          if (olderExes.length > 0) {
            const olderDownloads = olderExes.reduce((s, e) => s + e.download_count, 0);
            bodyHtml += `
              <div class="exe-toggle" data-target="older-${toggleId}">
                <span class="exe-toggle-arrow">▸</span>
                <span class="exe-toggle-label">${olderExes.length} older release${olderExes.length !== 1 ? 's' : ''}</span>
                <span class="exe-toggle-badge">${olderDownloads.toLocaleString()} dl</span>
              </div>
              <div class="exe-older-wrap" id="older-${toggleId}">
                <div class="exe-older-inner">`;
            for (const exe of olderExes) {
              bodyHtml += exeBtn(exe, accent, false);
            }
            bodyHtml += '</div></div>';
          }

          bodyHtml += '</div>';
        } else {
          bodyHtml = '<div class="no-exe">No executables found</div>';
        }

        cardsHtml += `
          <div class="repo-card" style="--accent:${accent};--accent-glow:${glowRgb};--accent-bg:${accent}15;--accent-text:${accent}">
            <div class="repo-owner">
                <img class="repo-avatar" src="${ownerAvatar}" alt="${ownerLogin}">
                <span class="repo-owner-name">${ownerLogin}</span>
              </div>
            <div class="repo-card-header">
              ${icon ? `<div class="repo-icon" style="background:${accent};box-shadow:0 4px 16px ${glowRgb}">${icon}</div>` : ''}
            <div class="repo-card-info">
                  <div class="repo-card-name">${label}</div>
                  <div class="repo-card-sub">
                    <span class="repo-card-count">${repoTotal.toLocaleString()} downloads</span>
                    <span class="repo-card-releases">${releaseCount} release${releaseCount !== 1 ? 's' : ''}</span>
                    ${stars > 0 ? `<span class="star-badge"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>${stars}</span>` : ''}
                  </div>
                </div>
              </div>
              ${installCmd}${bodyHtml}
              <div class="repo-footer">
                <a class="repo-link" href="${repoUrl}" target="_blank" rel="noopener">
                  <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12 24 5.37 18.63 0 12 0z"/></svg>
                  View Repository
                </a>
              </div>
            </div>`;
      }

      const hero = `
        <div class="hero">
          <h1>5 Free <span>Apps Bundle</span></h1>
          <p>Live download tracker for all projects</p>
          <p id="lastUpdated" style="font-size:12px;color:rgba(255,255,255,0.2);margin-top:4px"></p>
          ${REPOS.length > 1 ? `
          <div class="hero-grand">
            <span class="hero-grand-label">Grand Total</span>
            <span class="hero-grand-num" id="grandTotal">0</span>
          </div>` : ''}
        </div>`;

      app.innerHTML = hero + `<div class="grid" id="grid">${cardsHtml}</div>`;

      // Animate grand total
      if (REPOS.length > 1) {
        const el = document.getElementById('grandTotal');
        let current = 0;
        const step = Math.max(1, Math.floor(grandTotal / 40));
        const interval = setInterval(() => {
          current += step;
          if (current >= grandTotal) {
            current = grandTotal;
            clearInterval(interval);
          }
          el.textContent = current.toLocaleString();
        }, 30);
      }

      // Staggered card entrance
      const cards = document.querySelectorAll('.repo-card');
      cards.forEach((card, i) => {
        setTimeout(() => card.classList.add('visible'), 150 + i * 100);
      });

      // Install overlay: show on hover, auto-hide after 4s
      document.querySelectorAll('.install-code-wrap').forEach(wrap => {
        const cmd = wrap.querySelector('.install-copy').dataset.cmd;
        // Click anywhere on the code block copies the command
        wrap.addEventListener('click', () => {
          navigator.clipboard.writeText(cmd).then(() => {
            const btn = wrap.querySelector('.install-copy');
            const orig = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = orig, 1500);
          });
        });
        // Hover overlay
        wrap.addEventListener('mouseenter', () => {
          const overlay = wrap.querySelector('.install-overlay');
          if (!overlay || overlay.classList.contains('show')) return;
          overlay.classList.add('show');
          setTimeout(() => overlay.classList.remove('show'), 4000);
        });
      });

      // Toggle older releases dropdown
      document.querySelectorAll('.exe-toggle').forEach(tog => {
        tog.addEventListener('click', () => {
          const wrap = document.getElementById(tog.dataset.target);
          const isOpen = wrap.classList.toggle('open');
          tog.classList.toggle('open');
          tog.querySelector('.exe-toggle-arrow').textContent = isOpen ? '▾' : '▸';
          const count = wrap.querySelectorAll('.exe-btn--disabled').length;
          tog.querySelector('.exe-toggle-label').textContent = isOpen
            ? 'Hide older releases'
            : `${count} older release${count !== 1 ? 's' : ''}`;
        });
      });
    }

    function updateTimestamp() {
      const el = document.getElementById('lastUpdated');
      if (el) el.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
    }

    loadAll().then(updateTimestamp, updateTimestamp);
    setInterval(() => loadAll().then(updateTimestamp, updateTimestamp), 600000);
  </script>

</body>
</html>
